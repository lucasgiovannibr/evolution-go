version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
  settings:
    staticcheck:
      # Bugs and deprecated APIs only: the style checks (ST*, QF*) would be noise on this code base.
      checks: ["SA*"]
  exclusions:
    paths:
      - pkg/core # the license runtime: not ours to reformat or lint
