name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    # Real brokers for the producer tests (they skip when these variables are unset).
    services:
      rabbitmq:
        image: rabbitmq:3
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      nats:
        image: nats:2
        ports: ["4222:4222"]
    env:
      AMQP_TEST_URL: amqp://guest:guest@localhost:5672/
      NATS_TEST_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v4

      # go.mod is the single source of truth for the toolchain version.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      # go build never compiles _test.go files; vet does.
      - run: go vet ./...
      # -race is what catches the concurrent map / websocket write class of bugs.
      - run: go test -race ./...

      # Fails only on vulnerabilities the code can actually reach.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
