name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go.mod is the single source of truth for the toolchain version.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      # go build never compiles _test.go files; vet does.
      - run: go vet ./...
      # -race is what catches the concurrent map / websocket write class of bugs.
      - run: go test -race ./...
